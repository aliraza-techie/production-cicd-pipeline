name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high


  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build --if-present


  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging

    steps:
      - name: Staging deployment
        run: echo "🚀 Deploying application to STAGING environment..."

      - name: Staging health check
        run: |
          echo "🔍 Running staging health check..."
          echo "✅ Staging deployment is healthy"


  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: staging
    environment:
      name: production

    steps:
      - name: Production deployment
        run: echo "🚀 Deploying application to PRODUCTION environment..."

      - name: Production health check
        run: |
          echo "🔍 Running production health check..."
          echo "✅ Production deployment is healthy"